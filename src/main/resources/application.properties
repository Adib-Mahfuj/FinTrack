spring.application.name=fintrack

#MySql Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fintrackappdb
spring.datasource.username=root
spring.datasource.password=root

server.servlet.context-path=/api/v1.0

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Brevo API Key Configuration
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_FROM_EMAIL}
brevo.sender.name=FinTrack


#JWT
jwt.secret=myVerySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong
jwt.expiration=86400000

finance.tracker.frontend.url=${FINTRACK_FRONTEND_URL}

app.activation.url=${FINTRACK_BACKEND_URL}

spring.profiles.active=prod